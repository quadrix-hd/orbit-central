name: orbit
services:
  orbit:
    image: ${ORBIT_IMAGE:-orbit-console:local}
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    ports:
      - "${ORBIT_LISTEN:-127.0.0.1}:${ORBIT_PORT:-8080}:8080"
    environment:
      ORBIT_PUBLIC_ORIGIN: ${ORBIT_PUBLIC_ORIGIN:-http://localhost:8080}
      ORBIT_DATA_DIR: /data
      ORBIT_CATALOG_MODE: ${ORBIT_CATALOG_MODE:-web}
      ORBIT_CATALOG_URL: ${ORBIT_CATALOG_URL:-https://quadrix-hd.github.io/orbit-central/catalog.json}
      ORBIT_CA_FILE: ${ORBIT_CA_FILE:-}
    volumes:
      - orbit-data:/data
      # Eigene CA: diese Zeile aktivieren und ORBIT_CA_FILE=/certs/proxmox-ca.pem setzen.
      # - ./certs/proxmox-ca.pem:/certs/proxmox-ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  orbit-data:
