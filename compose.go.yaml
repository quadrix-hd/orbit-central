# Isolated preview: different container, port and data volume from production.
name: orbit-go-preview
services:
  orbit-go:
    image: orbit-go:preview
    build:
      context: .
      dockerfile: Dockerfile.golang
    ports:
      - "${ORBIT_GO_LISTEN:-127.0.0.1}:${ORBIT_GO_PORT:-8081}:8080"
    environment:
      ORBIT_DATA_DIR: /data
      ORBIT_PUBLIC_ORIGIN: ${ORBIT_GO_PUBLIC_ORIGIN:-http://localhost:8081}
      ORBIT_CA_FILE: ${ORBIT_CA_FILE:-}
    volumes:
      - orbit-go-data:/data
      # Same CA as production, if required:
      # - ./certs/proxmox-ca.pem:/certs/proxmox-ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    stop_grace_period: 35s
volumes:
  orbit-go-data:
